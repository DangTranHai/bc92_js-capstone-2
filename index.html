<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhoneShop - Chọn quyền</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-50 to-slate-50 text-slate-800">
  <main class="max-w-5xl mx-auto px-6 py-16">
    <div class="text-center mb-12">
      <h1 class="text-4xl md:text-5xl font-extrabold text-blue-700">PhoneShop</h1>
      <p class="mt-3 text-slate-600">Chọn quyền truy cập để vào hệ thống</p>
    </div>

    <div class="grid md:grid-cols-2 gap-8">
     
      <a
        href="./BC92-User/index1.html"
        class="group bg-white rounded-2xl border shadow-sm hover:shadow-md transition p-8"
      >
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-xl bg-blue-100 flex items-center justify-center text-blue-700 text-xl">
            <i class="fa-solid fa-user"></i>
          </div>
          <div>
            <h2 class="text-2xl font-bold">User</h2>
            <p class="text-slate-600">Xem sản phẩm, lọc theo loại, giỏ hàng</p>
          </div>
        </div>

        <div class="mt-8">
          <span
            class="inline-flex items-center gap-2 bg-blue-600 text-white px-5 py-3 rounded-xl font-semibold"
          >
            Vào trang User
            <span class="group-hover:translate-x-1 transition">→</span>
          </span>
        </div>
      </a>

     
      <a
        href="./BC92-Admin/index2.html"
        class="group bg-white rounded-2xl border shadow-sm hover:shadow-md transition p-8"
      >
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-xl bg-amber-100 flex items-center justify-center text-amber-800 text-xl">
            <i class="fa-solid fa-user-shield"></i>
          </div>
          <div>
            <h2 class="text-2xl font-bold">Admin</h2>
            <p class="text-slate-600">Quản lý sản phẩm (CRUD, search, sort...)</p>
          </div>
        </div>

        <div class="mt-8">
          <span
            class="inline-flex items-center gap-2 bg-amber-500 text-white px-5 py-3 rounded-xl font-semibold"
          >
            Vào trang Admin
            <span class="group-hover:translate-x-1 transition">→</span>
          </span>
        </div>
      </a>
    </div>

    <p class="text-center text-sm text-slate-500 mt-10">
      
    </p>
  </main>
</body>
</html>
